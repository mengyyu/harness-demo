services:
  # FastAPI Backend
  - type: web
    name: harness-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/harness.db
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MODEL
        value: mock
      - key: LANGFUSE_ENABLED
        value: "false"
      - key: MEM0_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"
