# Railway Deployment Configuration
# Docs: https://docs.railway.com/reference/config-as-code

[build]
  builder = "nixpacks"
  nixpacksPlanFile = "./nixpacks.toml"

[deploy]
  numReplicas = 1
  startCommand = "bash railway_start.sh"
  healthcheckPath = "/health"
  healthcheckTimeout = 120
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3

[service]
  name = "harness-api"

# ═══════════════════════════════════════════════
# Environment Variables
# ═══════════════════════════════════════════════

[variables]
  DATABASE_URL = "sqlite:///./data/harness.db"
  LLM_PROVIDER = "mock"
  LLM_MODEL = "mock"
  LANGFUSE_ENABLED = "false"
  MEM0_ENABLED = "false"
  SKILLS_DIR = "skills"
  MCP_SERVERS_DIR = "mcp_servers"
  LOG_LEVEL = "INFO"
