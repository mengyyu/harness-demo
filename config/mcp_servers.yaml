# MCP Server Connection Configuration
# Supports stdio (subprocess) and sse (HTTP) transports

servers:
  - name: demo_tools
    description: "Demo MCP Server — 提供文档解析、账户分析、持仓查询"
    transport: stdio
    command: python
    args: ["-m", "mcp_servers.demo_tools"]
    timeout: 30
    enabled: true

