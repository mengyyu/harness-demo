[project]
name = "harness-framework"
version = "0.2.0"
description = "Harness Agent Framework — DeepAgents + LangGraph + LangChain + LangFuse + Mem0"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Harness Team" }
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "mem0ai>=0.1.0",
    "langfuse>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.35.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*", "api*", "admin*", "mcp_servers*", "config*"]
